name: Run ClientFinder AI Automatically

on:
  # 1. Runs automatically on a schedule (e.g., every day at 00:00 UTC)
  schedule:
    - cron: '0 0 * * *'
  
  # 2. Allows you to run it manually with a button click from the GitHub website
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository code so the runner can access it
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install dependencies (if you have a requirements.txt file)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run your main Python script (replace main.py with your actual script file name)
      - name: Run Python Script
        run: python main.py